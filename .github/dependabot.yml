version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      wordpress:
        patterns: [ '@wordpress/*' ]
      dev-tools:
        patterns: [ '*' ]
        exclude-patterns: [ '@wordpress/*' ]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      php-tools:
        patterns: [ '*' ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
